<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
  　<link rel="apple-touch-icon" href="Papirus-Team-Papirus-Apps-Pingus-icon-192.png">
  　<meta name="apple-mobile-web-app-capable" content="yes">
  　<meta name="apple-mobile-web-app-status-bar-style" content="default">
  　<meta name="apple-mobile-web-app-title" content="就業報告書">
    <title>就業報告書 入力システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @media print {
            .no-print { display: none; }
            body { background-color: white; padding: 0; margin: 0; }
            .print-container { 
                width: 210mm;
                height: 297mm;
                margin: 0 !important; 
                padding: 10mm;
                box-shadow: none;
                border: none;
            }
            input, textarea, select { 
                border: none !important; 
                outline: none !important; 
                background: transparent !important; 
                -webkit-appearance: none; 
                appearance: none; 
            }
        }
        
        .report-table { border-collapse: collapse; width: 100%; }
        .report-table th, .report-table td {
            border: 1px solid #000; padding: 0 2px; font-size: 10px; height: 25px;
        }
        
        .page-a4 {
            width: 210mm; height: 297mm; background: white; margin: 0 auto;
            padding: 8mm 10mm; box-sizing: border-box; display: flex;
            flex-direction: column; overflow: hidden; position: relative;
        }

        /* PDF出力時の一時的なクラス */
        .pdf-exporting {
            margin: 0 !important;
            transform: none !important;
        }

        .day-invalid { background-color: #f3f4f6; pointer-events: none; color: transparent; }
        #loading-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8); z-index: 9999; justify-content: center;
            align-items: center; flex-direction: column;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen py-4 font-sans relative" id="body">

    <div id="toast" class="fixed bottom-4 right-4 bg-gray-800 text-white px-6 py-3 rounded shadow-xl transition-opacity duration-300 opacity-0 pointer-events-none z-50 font-bold">
        入力内容を保存しました
    </div>

    <div id="loading-overlay">
        <div class="animate-spin h-10 w-10 border-4 border-blue-500 rounded-full border-t-transparent mb-4"></div>
        <p class="font-bold text-gray-700">PDFを作成中...</p>
    </div>

    <div class="page-a4 shadow-2xl print-container" id="report-content">
        <!-- ヘッダー -->
        <div class="flex justify-between items-start mb-2">
            <div>
                <h1 class="text-2xl font-bold border-b-2 border-black pb-1 mb-1 tracking-widest">就業報告書 <span class="text-xs font-normal border border-black px-2 ml-4 align-middle">提出用</span></h1>
                <div class="flex items-center space-x-2 text-sm mt-1">
                    <input type="number" id="year-val" class="w-16 border-b border-black text-center outline-none font-bold" value="2026"> <span>年</span>
                    <input type="number" id="month-val" class="w-12 border-b border-black text-center outline-none font-bold" value="8"> <span>月分</span>
                </div>
            </div>
            <div class="w-72 space-y-1 text-[11px]">
                <div class="flex border-b border-black">
                    <span class="w-[5.5rem] font-bold whitespace-nowrap flex-shrink-0">契約件名：</span>
                    <input type="text" id="contract-name" class="flex-1 outline-none" value="業務委託">
                </div>
                <div class="flex border-b border-black">
                    <span class="w-[5.5rem] font-bold whitespace-nowrap flex-shrink-0">契約番号：</span>
                    <input type="text" id="contract-number" class="flex-1 outline-none">
                </div>
                <div class="flex border-b border-black">
                    <span class="w-[5.5rem] font-bold whitespace-nowrap flex-shrink-0">発注者名：</span>
                    <input type="text" id="client-name" class="flex-1 outline-none text-right">
                    <span class="ml-1">様</span>
                </div>
                <div class="flex border-b border-black mt-1">
                    <span class="w-[5.5rem] font-bold whitespace-nowrap flex-shrink-0">会員番号：</span>
                    <input type="text" id="member-number" class="flex-1 outline-none">
                </div>
                <div class="flex border-b border-black">
                    <span class="w-[5.5rem] font-bold whitespace-nowrap flex-shrink-0">会員氏名：</span>
                    <input type="text" id="member-name" class="flex-1 outline-none text-lg">
                </div>
            </div>
        </div>

        <!-- 内容入力 -->
        <div class="border border-black mb-2">
            <div class="bg-gray-50 border-b border-black p-1 text-[10px] font-bold flex justify-between items-center">
                <span>【仕事の内容／連絡事項／申し送り事項】</span>
            </div>
            <textarea id="work-description" class="w-full h-8 p-1 text-xs outline-none resize-none leading-tight" placeholder="就業内容を記入"></textarea>
        </div>

        <!-- 日付テーブルグリッド -->
        <div class="grid grid-cols-2 border-t border-l border-black">
            <!-- 左カラム (1-16日) -->
            <div class="border-b border-black">
                <table class="report-table">
                    <thead>
                        <tr class="bg-gray-100 text-[10px]">
                            <th class="w-5">日</th>
                            <th class="w-5">曜</th>
                            <th>開始時間</th>
                            <th>終了時間</th>
                            <th class="w-9">経過時間</th>
                        </tr>
                    </thead>
                    <tbody id="days-left"></tbody>
                </table>
            </div>

            <!-- 右カラム (17-31日 + 合計・承認) -->
            <div class="flex flex-col border-b border-black">
                <table class="report-table">
                    <thead>
                        <tr class="bg-gray-100 text-[10px]">
                            <th class="w-5">日</th>
                            <th class="w-5">曜</th>
                            <th>開始時間</th>
                            <th>終了時間</th>
                            <th class="w-9">経過時間</th>
                        </tr>
                    </thead>
                    <tbody id="days-right"></tbody>
                </table>
                
                <div class="flex border-l border-black h-[50px]">
                    <div class="w-1/2 flex items-center justify-between px-2 border-r border-black bg-gray-50/30">
                        <span class="font-bold text-sm">合 計</span>
                        <div class="flex items-end">
                            <input type="number" id="total-days" class="w-12 border-b border-black text-center font-bold text-xl bg-transparent" readonly value="0">
                            <span class="ml-0.5 font-bold text-xs">日</span>
                        </div>
                    </div>
                    <div class="w-1/2 flex items-center justify-center text-[8px] leading-tight text-center border-r border-black">
                        単位・回数・時間
                    </div>
                </div>

                <div class="flex border-t border-l border-black flex-1 min-h-[50px]">
                    <div class="flex-1 p-1 text-[9px] flex items-center leading-tight">
                        貴センターに発注した仕事が履行されたことを確認いたします。
                    </div>
                    <div class="w-20 border-l border-r border-black p-1 text-[8px] relative flex flex-col justify-between items-center">
                        <span class="w-full text-left">承認印</span>
                        <div class="absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none text-red-500 font-bold text-base">印</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 下部：事務局と計算 -->
        <div class="grid grid-cols-2 gap-4 mt-2">
            <div class="border border-black flex flex-col text-[10px]">
                <div class="bg-gray-50 border-b border-black p-1 font-bold">【事務局記入欄】</div>
                <div class="flex-1 min-h-[40px]"></div>
                <div class="p-2 border-t border-black bg-gray-50/30">
                    <div class="font-bold">公益社団法人 町田市シルバー人材センター</div>
                    <div class="text-[8px]">〒194-0022 町田市森野1-1-15</div>
                </div>
            </div>

            <div class="border border-black text-[10px] p-2 space-y-1">
                <div class="mb-1">配分金</div>
                <div class="flex justify-between items-center pl-2">
                    <select class="outline-none bg-transparent cursor-pointer font-bold border-b border-gray-300" id="type-1">
                        <option value="時間" selected>時間</option>
                        <option value="単位">単位</option>
                        <option value="回数">回数</option>
                        <option value="出来高">出来高</option>
                    </select>
                    <div class="flex items-center space-x-1">
                        <input type="number" class="w-12 border-b border-black text-right calc-input" id="rate-1" value="1220"><span>円×</span>
                        <input type="number" step="0.5" class="w-10 border-b border-black text-center calc-input" id="qty-1" value="0"><span>=</span>
                        <input type="text" class="w-14 border-b border-black text-right" id="sub-1" readonly value="0">
                    </div>
                </div>
                <div class="flex justify-between items-center border-b border-gray-100 pb-1 pl-2">
                    <select class="outline-none bg-transparent cursor-pointer font-bold border-b border-gray-300" id="type-2">
                        <option value="時間">時間</option>
                        <option value="単位">単位</option>
                        <option value="回数">回数</option>
                        <option value="出来高">出来高</option>
                    </select>
                    <div class="flex items-center space-x-1">
                        <input type="number" class="w-12 border-b border-black text-right calc-input" id="rate-2" value="0"><span>円×</span>
                        <input type="number" step="0.5" class="w-10 border-b border-black text-center calc-input" id="qty-2" value="0"><span>=</span>
                        <input type="text" class="w-14 border-b border-black text-right" id="sub-2" readonly value="0">
                    </div>
                </div>
                <div class="flex justify-between">
                    <span>交通費/控除</span>
                    <span><input type="number" class="w-12 text-right border-b calc-input" id="transport" value="0"> / <input type="number" class="w-12 text-right border-b calc-input text-red-500" id="deduction" value="0"></span>
                </div>
                <div class="flex justify-between font-bold bg-gray-100 px-1 mt-1">
                    <span>配分金合計</span>
                    <span><span id="total-allowance">0</span> 円</span>
                </div>
                <div class="flex justify-between font-bold text-sm border-t border-black pt-1">
                    <span>合 計</span>
                    <span><span id="grand-total">0</span> 円</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 外部ファイル入出力ボタン -->
    <div class="max-w-4xl mx-auto mt-2 flex justify-end space-x-2 no-print px-4">
        <button onclick="exportDataToFile()" class="bg-teal-600 text-white py-1 px-3 rounded shadow font-bold text-xs hover:bg-teal-700 transition-colors">設定をファイルに保存</button>
        <label class="bg-teal-600 text-white py-1 px-3 rounded shadow font-bold text-xs hover:bg-teal-700 transition-colors cursor-pointer">
            ファイルから読み込む
            <input type="file" id="import-file" class="hidden" accept=".json" onchange="importDataFromFile(event)">
        </label>
    </div>

    <!-- 操作ボタン (一時保存の前に音声入力ボタンを配置) -->
    <div class="max-w-4xl mx-auto mt-4 grid grid-cols-5 gap-2 no-print px-4 text-center">
        <!-- 音声入力ボタン -->
        <button id="mic-btn" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-800 border border-indigo-300 py-2 rounded shadow font-bold text-sm flex items-center justify-center transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8h-2a5 5 0 01-10 0H3a7.001 7.001 0 006 6.93V17H6v2h8v-2h-3v-2.07z" clip-rule="evenodd" />
            </svg>
            <span id="mic-text">音声入力</span>
        </button>
        <button onclick="saveData(true)" class="bg-yellow-500 text-white py-2 rounded shadow font-bold text-sm hover:bg-yellow-600">一時保存</button>
        <button onclick="clearData()" class="bg-red-500 text-white py-2 rounded shadow font-bold text-sm hover:bg-red-600">クリア</button>
        <button onclick="handlePrint()" class="bg-gray-700 text-white py-2 rounded shadow font-bold text-sm hover:bg-gray-800">印刷</button>
        <button onclick="downloadPDF()" class="bg-blue-600 text-white py-2 rounded shadow font-bold text-sm hover:bg-blue-700">PDF保存</button>
    </div>

    <script>
        const daysLeft = document.getElementById('days-left');
        const daysRight = document.getElementById('days-right');
        const totalDaysInput = document.getElementById('total-days');
        const yearInput = document.getElementById('year-val');
        const monthInput = document.getElementById('month-val');
        const loading = document.getElementById('loading-overlay');
        const weekDaysJP = ["日", "月", "火", "水", "木", "金", "土"];
        
        let lastFocusedTimeInput = null;
        document.addEventListener('focusin', (e) => {
            // 開始時間・終了時間の入力欄にフォーカスが当たったら記録する
            if (e.target && e.target.tagName === 'INPUT' && (e.target.id.startsWith('am-') || e.target.id.startsWith('pm-'))) {
                lastFocusedTimeInput = e.target;
            } else if (e.target && e.target.id !== 'mic-btn') {
                // 音声入力ボタン以外をタップしたら記録をリセット
                lastFocusedTimeInput = null;
            }
        });

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2500);
        }

        function calculateElapsedTime(start, end) {
            if (!start || !end) return "";
            const [startH, startM] = start.split(':').map(Number);
            const [endH, endM] = end.split(':').map(Number);
            if (isNaN(startH) || isNaN(startM) || isNaN(endH) || isNaN(endM)) return "";

            const startDate = new Date(0, 0, 0, startH, startM, 0);
            const endDate = new Date(0, 0, 0, endH, endM, 0);
            let diff = (endDate - startDate) / (1000 * 60 * 60);
            if (diff < 0) diff += 24; 

            // 休憩時間の自動控除ルール
            if (diff > 8) {
                diff -= 1.0; // 8時間を超える場合は1時間差し引く
            } else if (diff >= 6) {
                diff -= 0.75; // 6時間以上8時間以下の場合は0.75時間（45分）差し引く
            }

            if (diff < 0) diff = 0;
            return diff.toString();
        }

        function getDailyData() {
            const dailyData = {};
            for (let i = 1; i <= 31; i++) {
                const am = document.getElementById(`am-${i}`);
                const pm = document.getElementById(`pm-${i}`);
                const vol = document.getElementById(`vol-${i}`);
                dailyData[i] = {
                    am: am ? am.value : "",
                    pm: pm ? pm.value : "",
                    vol: vol ? vol.value : ""
                };
            }
            return dailyData;
        }

        function updateCalendar(savedDailyData = null) {
            if (!savedDailyData) savedDailyData = getDailyData();

            daysLeft.innerHTML = '';
            daysRight.innerHTML = '';
            const year = parseInt(yearInput.value);
            const month = parseInt(monthInput.value);
            const lastDate = new Date(year, month, 0).getDate();

            for (let i = 1; i <= 31; i++) {
                const tr = document.createElement('tr');
                let dayOfWeek = "";
                let isInvalid = false;

                if (i <= lastDate) {
                    const date = new Date(year, month - 1, i);
                    dayOfWeek = weekDaysJP[date.getDay()];
                } else {
                    isInvalid = true;
                    tr.classList.add('day-invalid');
                }

                const amVal = savedDailyData[i] ? (savedDailyData[i].am || "") : "";
                const pmVal = savedDailyData[i] ? (savedDailyData[i].pm || "") : "";
                const volVal = savedDailyData[i] ? (savedDailyData[i].vol || "") : "";

                tr.innerHTML = `
                    <td class="text-center font-bold bg-gray-50/50">${i}</td>
                    <td class="text-center text-[10px] font-medium">${dayOfWeek}</td>
                    <td><input type="text" id="am-${i}" value="${amVal}" class="w-full outline-none row-summary bg-transparent px-1 text-center" placeholder="--:--" ${isInvalid ? 'disabled' : ''}></td>
                    <td><input type="text" id="pm-${i}" value="${pmVal}" class="w-full outline-none row-summary bg-transparent px-1 text-center" placeholder="--:--" ${isInvalid ? 'disabled' : ''}></td>
                    <td><input type="text" id="vol-${i}" value="${volVal}" class="w-full outline-none row-summary bg-transparent text-center px-1" ${isInvalid ? 'disabled' : ''}></td>
                `;

                if (i <= 16) daysLeft.appendChild(tr);
                else daysRight.appendChild(tr);

                if (!isInvalid) {
                    const amInput = tr.querySelector(`#am-${i}`);
                    const pmInput = tr.querySelector(`#pm-${i}`);
                    const volInput = tr.querySelector(`#vol-${i}`);

                    const updateTime = () => {
                        if (amInput.value && pmInput.value) {
                            const time = calculateElapsedTime(amInput.value, pmInput.value);
                            if(time) volInput.value = time;
                        }
                        calculateTotalDays();
                    };

                    tr.querySelectorAll('.row-summary').forEach(input => {
                        input.addEventListener('input', () => {
                            if (input === amInput || input === pmInput) updateTime();
                            else calculateTotalDays();
                        });
                    });
                }
            }
            calculateTotalDays();
        }

        function calculateTotalDays() {
            let count = 0;
            let totalTime = 0;
            const rows = [...document.querySelectorAll('#days-left tr'), ...document.querySelectorAll('#days-right tr')];
            
            rows.forEach(tr => {
                if (tr.classList.contains('day-invalid')) return;
                const inputs = tr.querySelectorAll('.row-summary');
                let hasValue = false;
                inputs.forEach(input => { if (input.value.trim() !== '') hasValue = true; });
                if (hasValue) count++;

                const volInput = tr.querySelector('input[id^="vol-"]');
                if (volInput && volInput.value) {
                    const time = parseFloat(volInput.value);
                    if (!isNaN(time)) totalTime += time;
                }
            });
            
            totalDaysInput.value = count;
            const type1 = document.getElementById('type-1').value;
            document.getElementById('qty-1').value = (type1 === '時間') ? totalTime : count;
            updateCalculations();
        }

        function updateCalculations() {
            const r1 = parseInt(document.getElementById('rate-1').value) || 0;
            const q1 = parseFloat(document.getElementById('qty-1').value) || 0;
            const sub1 = Math.floor(r1 * q1);
            document.getElementById('sub-1').value = sub1.toLocaleString();

            const r2 = parseInt(document.getElementById('rate-2').value) || 0;
            const q2 = parseFloat(document.getElementById('qty-2').value) || 0;
            const sub2 = Math.floor(r2 * q2);
            document.getElementById('sub-2').value = sub2.toLocaleString();

            const transport = parseInt(document.getElementById('transport').value) || 0;
            const deduction = parseInt(document.getElementById('deduction').value) || 0;

            const totalAllowance = sub1 + sub2 + transport - deduction;
            document.getElementById('total-allowance').innerText = totalAllowance.toLocaleString();

            // 手数料/事務経費を完全に0に設定し、合計を計算
            const adminFee = 0; 
            const grandTotal = totalAllowance + adminFee;
            document.getElementById('grand-total').innerText = grandTotal.toLocaleString();
        }

        function saveData(showMsg = false) {
            const data = {
                year: yearInput.value, month: monthInput.value,
                contractName: document.getElementById('contract-name').value,
                contractNumber: document.getElementById('contract-number').value,
                clientName: document.getElementById('client-name').value,
                memberNumber: document.getElementById('member-number').value,
                memberName: document.getElementById('member-name').value,
                workDescription: document.getElementById('work-description').value,
                type1: document.getElementById('type-1').value, rate1: document.getElementById('rate-1').value, qty1: document.getElementById('qty-1').value,
                type2: document.getElementById('type-2').value, rate2: document.getElementById('rate-2').value, qty2: document.getElementById('qty-2').value,
                transport: document.getElementById('transport').value, deduction: document.getElementById('deduction').value,
                dailyData: getDailyData()
            };
            localStorage.setItem('workReportData', JSON.stringify(data));
            if (showMsg) showToast("入力内容を保存しました");
        }

        function loadData() {
            const saved = localStorage.getItem('workReportData');
            if (saved) {
                const data = JSON.parse(saved);
                if (data.year) yearInput.value = data.year;
                if (data.month) monthInput.value = data.month;
                if (data.contractName) document.getElementById('contract-name').value = data.contractName;
                if (data.contractNumber) document.getElementById('contract-number').value = data.contractNumber;
                if (data.clientName) document.getElementById('client-name').value = data.clientName;
                if (data.memberNumber) document.getElementById('member-number').value = data.memberNumber;
                if (data.memberName) document.getElementById('member-name').value = data.memberName;
                if (data.workDescription) document.getElementById('work-description').value = data.workDescription;
                if (data.type1) document.getElementById('type-1').value = data.type1;
                if (data.rate1) document.getElementById('rate-1').value = data.rate1;
                if (data.type2) document.getElementById('type-2').value = data.type2;
                if (data.rate2) document.getElementById('rate-2').value = data.rate2;
                if (data.transport) document.getElementById('transport').value = data.transport;
                if (data.deduction) document.getElementById('deduction').value = data.deduction;
                updateCalendar(data.dailyData);
            } else {
                updateCalendar();
            }
        }

        function clearData() {
            if (confirm('入力内容をすべてリセットして白紙に戻しますか？')) {
                localStorage.removeItem('workReportData'); location.reload();
            }
        }

        function handlePrint() { window.print(); }

        async function downloadPDF() {
            loading.style.display = 'flex';
            
            // 画面のスクロール位置による見切れを防ぐため、一番上へスクロール
            window.scrollTo(0, 0);
            
            const element = document.getElementById('report-content');
            element.classList.add('pdf-exporting'); // 中央寄せマージンを一時解除

            const name = document.getElementById('member-name').value || '会員';
            
            const opt = {
                margin: 0, 
                filename: `就業報告書_${yearInput.value}年${monthInput.value}月_${name}.pdf`,
                image: { type: 'jpeg', quality: 1.0 },
                html2canvas: { 
                    scale: 2, 
                    useCORS: true, 
                    scrollY: 0, 
                    scrollX: 0,
                    x: 0,
                    y: 0
                },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true }
            };

            try { 
                await html2pdf().set(opt).from(element).save(); 
            } 
            catch (e) { 
                console.error(e); 
            } 
            finally { 
                element.classList.remove('pdf-exporting');
                loading.style.display = 'none'; 
            }
        }

        function parseAndApplyVoiceCommand(text) {
            // もし開始時間・終了時間の入力欄にカーソルがあった場合
            if (lastFocusedTimeInput) {
                const timeMatches = [...text.matchAll(/(\d{1,2})(?:時|[:：](\d{2}))?(半)?/g)];
                if (timeMatches.length > 0) {
                    let h = parseInt(timeMatches[0][1], 10);
                    let m = timeMatches[0][2] ? parseInt(timeMatches[0][2], 10) : (timeMatches[0][3] ? 30 : 0);
                    
                    if ((text.includes('午後') || text.includes('夕方') || text.includes('夜')) && h < 12) {
                        h += 12;
                    }
                    
                    lastFocusedTimeInput.value = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                    
                    const dayNum = lastFocusedTimeInput.id.split('-')[1];
                    const amInput = document.getElementById(`am-${dayNum}`);
                    const pmInput = document.getElementById(`pm-${dayNum}`);
                    const volInput = document.getElementById(`vol-${dayNum}`);
                    
                    // 両方入力されていたら経過時間を計算
                    if (amInput.value && pmInput.value) {
                        const calculated = calculateElapsedTime(amInput.value, pmInput.value);
                        if (calculated) volInput.value = calculated;
                    }
                    calculateTotalDays();
                    showToast(`時刻を入力しました`);
                    return true;
                }
            }

            const dayMatch = text.match(/(\d{1,2})\s*日/);
            if (!dayMatch) {
                // 日付が含まれない場合は【仕事の内容／連絡事項／申し送り事項】の欄に入力する
                const workDesc = document.getElementById('work-description');
                if (workDesc) {
                    if (workDesc.value.trim() !== "") {
                        workDesc.value += " " + text;
                    } else {
                        workDesc.value = text;
                    }
                    saveData(false);
                    showToast("仕事の内容欄に入力しました");
                    return true;
                }
                return false;
            }

            const dayNum = parseInt(dayMatch[1], 10);
            if (dayNum < 1 || dayNum > 31) return false;

            const amInput = document.getElementById(`am-${dayNum}`);
            const pmInput = document.getElementById(`pm-${dayNum}`);
            const volInput = document.getElementById(`vol-${dayNum}`);

            if (!amInput || !pmInput || amInput.disabled) {
                showToast(`${dayNum}日目は入力できません`); return false;
            }

            // 消去コマンド
            if (text.includes('消去') || text.includes('クリア') || text.includes('削除') || text.includes('消す')) {
                amInput.value = ""; pmInput.value = ""; volInput.value = "";
                calculateTotalDays(); showToast(`${dayNum}日のデータを消去しました`); return true;
            }

            const timeMatches = text.matchAll(/(\d{1,2})(?:時|[:：](\d{2}))?(半)?/g);
            const foundTimes = [];
            for (const match of timeMatches) {
                let h = parseInt(match[1], 10);
                let m = match[2] ? parseInt(match[2], 10) : (match[3] ? 30 : 0);
                if (h !== dayNum && h >= 0 && h <= 24) {
                    foundTimes.push(`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`);
                }
            }

            const isGogo = text.includes('午後') || text.includes('夕方') || text.includes('夜');

            if (foundTimes.length >= 2) {
                amInput.value = foundTimes[0]; pmInput.value = foundTimes[1];
            } else if (foundTimes.length === 1) {
                if (isGogo) {
                    pmInput.value = foundTimes[0];
                    if (!amInput.value) amInput.value = "13:00";
                } else {
                    amInput.value = foundTimes[0];
                    if (!pmInput.value) pmInput.value = "17:00";
                }
            }

            if (amInput.value && pmInput.value) {
                const calculated = calculateElapsedTime(amInput.value, pmInput.value);
                if (calculated) volInput.value = calculated;
            }

            calculateTotalDays();
            showToast(`${dayNum}日のスケジュールを入力しました`);
            return true;
        }

        function setupSpeechRecognition() {
            const micBtn = document.getElementById('mic-btn');
            const micText = document.getElementById('mic-text');
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!window.SpeechRecognition) { micBtn.style.display = 'none'; return; }
            
            const recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.interimResults = false;
            recognition.continuous = false;
            let isRecording = false;

            micBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (isRecording) { recognition.stop(); return; }
                try { recognition.start(); } catch(e) { console.error(e); }
            });

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.replace('bg-indigo-100', 'bg-red-500');
                micBtn.classList.replace('text-indigo-800', 'text-white');
                micText.textContent = '録音中...';
                showToast("話してください（例：15日 9時 17時）");
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                parseAndApplyVoiceCommand(transcript);
            };

            recognition.onend = () => {
                isRecording = false;
                micBtn.classList.replace('bg-red-500', 'bg-indigo-100');
                micBtn.classList.replace('text-white', 'text-indigo-800');
                micText.textContent = '音声入力';
                saveData(false);
            };
            
            recognition.onerror = () => {
                isRecording = false;
                micBtn.classList.replace('bg-red-500', 'bg-indigo-100');
                micBtn.classList.replace('text-white', 'text-indigo-800');
                micText.textContent = '音声入力';
                showToast("音声認識が停止しました");
            };
        }

        function exportDataToFile() {
            saveData(false); // 最新状態をストレージに確保
            const data = localStorage.getItem('workReportData') || "{}";
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const ym = `${yearInput.value}年${monthInput.value}月`;
            a.download = `就業報告書_初期データ_${ym}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast("ファイルとしてダウンロードしました");
        }

        function importDataFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    localStorage.setItem('workReportData', JSON.stringify(data));
                    loadData(); // 画面に反映
                    showToast("データを読み込みました");
                } catch(err) {
                    alert("データの読み込みに失敗しました。対応していないファイルです。");
                }
                event.target.value = ''; // inputのクリア
            };
            reader.readAsText(file);
        }

        window.onload = () => {
            loadData();
            setupSpeechRecognition();
            let saveTimeout;
            document.addEventListener('input', () => {
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => saveData(false), 1000);
            });
            yearInput.addEventListener('input', () => updateCalendar());
            monthInput.addEventListener('input', () => updateCalendar());
            document.querySelectorAll('.calc-input').forEach(el => el.addEventListener('input', updateCalculations));
            document.getElementById('type-1').addEventListener('change', calculateTotalDays);
        };
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
            // 'service-worker.js' を登録 (index.htmlからの相対パス)
            navigator.serviceWorker.register('service-worker.js')
              .then((registration) => {
                console.log('Service Worker registered successfully:', registration.scope);
              })
              .catch((error) => {
                console.log('Service Worker registration failed:', error);
              });
          });
        }
    </script>
</body>
